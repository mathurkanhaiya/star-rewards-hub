<!doctype html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06080f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />

  <title>ADS Rewards - Earn & Withdraw</title>
  <meta name="description" content="Complete tasks, invite friends, spin the wheel & earn crypto rewards!" />
  <meta property="og:title" content="ADS Rewards Mini App" />
  <meta property="og:description" content="Earn crypto by completing tasks and inviting friends!" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Telegram Web App — must be first -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ad SDKs -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="10742752" data-sdk="show_10742752"></script>
  <script src="https://ad.gigapub.tech/script?id=5935"></script>

  <!-- Telegram Analytics -->
  <script
    async
    src="https://tganalytics.xyz/index.js"
    onload="initAnalytics()"
    type="text/javascript"
  ></script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* ── Safe area CSS variables ── */
    :root {
      --sat: env(safe-area-inset-top,    0px);
      --sar: env(safe-area-inset-right,  0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left,   0px);
      /* Nav height = bar height + safe area bottom */
      --nav-height: calc(64px + env(safe-area-inset-bottom, 0px));
      /* Page bottom padding = nav + breathing room */
      --page-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    }

    html {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
      /* Fill entire screen including notch/home bar areas */
      height: 100%;
      height: -webkit-fill-available;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #06080f;
      color: #fff;
      overscroll-behavior: none;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
      /* Force GPU layer — fixes iOS blank screen bug */
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
      background: #06080f;
      touch-action: manipulation;
      /* Isolate stacking context */
      isolation: isolate;
      /* Ensure content padding respects nav */
      padding-bottom: 0;
    }

    img {
      -webkit-user-drag: none;
      pointer-events: none;
    }
    img.clickable { pointer-events: auto; }

    a, button, [role="button"] {
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    /* ── Global page bottom padding helper ── */
    /* Apply class="page-root" to any scrollable page container */
    .page-root {
      padding-bottom: var(--page-bottom) !important;
    }
  </style>

  <script>
    (function () {

      /* ── iOS blank screen fix — force repaint ── */
      function forceRepaint() {
        document.body.style.transform = 'translateZ(0)';
        requestAnimationFrame(function() {
          document.body.style.transform = '';
        });
      }
      forceRepaint();
      setTimeout(forceRepaint, 150);
      setTimeout(forceRepaint, 500);

      /* ── Prevent pinch zoom ── */
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      /* ── Prevent double-tap zoom ── */
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      /* ── Prevent ctrl+scroll zoom ── */
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      /* ── Prevent ctrl+plus/minus zoom ── */
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=')) {
          e.preventDefault();
        }
      });

      /* ── Prevent context menu ── */
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      /* ── Prevent copy/cut outside inputs ── */
      document.addEventListener('copy', function(e) {
        var tag = document.activeElement && document.activeElement.tagName.toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') e.preventDefault();
      });
      document.addEventListener('cut', function(e) {
        var tag = document.activeElement && document.activeElement.tagName.toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') e.preventDefault();
      });

      /* ── Telegram WebApp init ── */
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;

      tg.expand();
      tg.ready();

      try { tg.setHeaderColor('#06080f'); } catch(e) {}
      try { tg.setBackgroundColor('#06080f'); } catch(e) {}
      try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e) {}

      /* ── Hide splash once React mounts ── */
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) {
          s.style.opacity = '0';
          s.style.transition = 'opacity 0.3s';
          setTimeout(function() { s && s.remove(); }, 350);
        }
      };

    })();
  </script>

</head>

<body>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
